# stringData is base64-encoded by the API server on write. That is encoding,
# not encryption: anyone allowed to `get secrets` can read these. The RBAC
# roles in rbac.yaml deliberately grant no access to Secrets for that reason.
apiVersion: v1
kind: Secret
metadata:
  name: task-tracker-secret
  namespace: dso202-assignment-02
type: Opaque
stringData:
  # backend
  DB_USER: taskuser
  DB_PASSWORD: TaskP@ss2026
  # postgres image (must match the above)
  POSTGRES_USER: taskuser
  POSTGRES_PASSWORD: TaskP@ss2026
