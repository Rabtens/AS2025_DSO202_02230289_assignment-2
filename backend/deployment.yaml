# Stateless API tier: interchangeable replicas, so a Deployment, not a StatefulSet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dso202-assignment-02
  labels:
    app: task-tracker
    tier: backend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: task-tracker
      tier: backend
  template:
    metadata:
      labels:
        app: task-tracker
        tier: backend
        version: v1                # Istio DestinationRule subset key (2.5)
    spec:
      serviceAccountName: backend-sa   # token not mounted: the app never calls the API server (2.3)
      containers:
        - name: backend
          image: sarojsanyasi/dso202-backend:1.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: task-tracker-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: task-tracker-secret
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          # Startup probe gives the sidecar + DB connection time on a cold start
          # before liveness can kill the container.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:            # TCP, not /api/status: a DB outage must not restart the API
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: dso202-assignment-02
  labels:
    app: task-tracker
    tier: backend
spec:
  type: ClusterIP                  # never exposed directly; reachable only via the Ingress
  selector:
    app: task-tracker
    tier: backend
  ports:
    - name: http                   # "http" name lets Istio apply L7 retries/timeouts
      port: 8080
      targetPort: http
