# 2.4 — Custom Resource Definition: teaches the API server a new noun, "TaskBackup".
# On its own this does nothing; operator/deployment.yaml runs the controller that
# reconciles each TaskBackup into a pg_dump Job.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: taskbackups.dso202.cst.edu.bt
spec:
  group: dso202.cst.edu.bt
  scope: Namespaced
  names:
    plural: taskbackups
    singular: taskbackup
    kind: TaskBackup
    shortNames: [tb]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}                  # status is written only by the controller, via /status
      additionalPrinterColumns:
        - name: Database
          type: string
          jsonPath: .spec.database.host
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: File
          type: string
          jsonPath: .status.backupFile
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "self == oldSelf"
                  message: "A TaskBackup is a one-shot request; create a new one instead of editing it."
              properties:
                database:
                  type: object
                  default: {}       # lets the API server fill in every nested default below
                  properties:
                    host:
                      type: string
                      default: db-0.db-headless   # StatefulSet stable DNS name (2.1)
                    port:
                      type: integer
                      default: 5432
                      minimum: 1
                      maximum: 65535
                    name:
                      type: string
                      default: taskdb
                    credentialsSecret:
                      type: string
                      default: task-tracker-secret
                storage:
                  type: object
                  default: {}
                  properties:
                    pvcName:
                      type: string
                      default: task-backups
                    size:
                      type: string
                      default: 1Gi
                      pattern: '^[0-9]+(Mi|Gi)$'
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Running, Succeeded, Failed]
                jobName:
                  type: string
                backupFile:
                  type: string
                startedAt:
                  type: string
                completedAt:
                  type: string
                message:
                  type: string
