# 2.3 applied to 2.4 — least privilege for the operator's own identity.
# The controller can touch only what it reconciles, and only in the namespace it watches.
apiVersion: v1
kind: Namespace
metadata:
  name: taskbackup-operator
  labels:
    course: dso202
    assignment: "2"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: taskbackup-operator
  namespace: taskbackup-operator
---
# Cluster-scoped, read-only, and only what the kopf framework itself needs:
# CRDs (to check the served CRD is installed) and namespaces (kopf watches them
# to resolve --namespace even when it is a single fixed name). No data access.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: taskbackup-operator-crd-reader
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: taskbackup-operator-crd-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: taskbackup-operator-crd-reader
subjects:
  - kind: ServiceAccount
    name: taskbackup-operator
    namespace: taskbackup-operator
---
# Everything else is a namespaced Role inside the application namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: taskbackup-operator
  namespace: dso202-assignment-02
rules:
  - apiGroups: ["dso202.cst.edu.bt"]
    resources: ["taskbackups"]
    verbs: ["get", "list", "watch", "patch"]     # patch: finalizer + kopf annotations
  - apiGroups: ["dso202.cst.edu.bt"]
    resources: ["taskbackups/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "create"]
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: taskbackup-operator
  namespace: dso202-assignment-02
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: taskbackup-operator
subjects:
  - kind: ServiceAccount
    name: taskbackup-operator
    namespace: taskbackup-operator
